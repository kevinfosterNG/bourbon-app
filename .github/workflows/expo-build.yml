name: Expo Build

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform (android|ios|all)'
        required: false
        default: 'all'
      profile:
        description: 'EAS build profile (development|preview|production)'
        required: false
        default: 'preview'

jobs:
  eas-build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve label/build settings
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "platform=${{ github.event.inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "platform=all" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          match=$(echo "$labels" | tr -d '[]" ' | tr ',' '\n' | grep -E '^eas-build-(android|ios|all):(development|preview|production)$' | head -n 1 || true)

          if [[ -z "$match" ]]; then
            echo "No eas-build label found; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          platform=$(echo "$match" | sed -E 's/^eas-build-([^:]+):(.+)$/\1/')
          profile=$(echo "$match" | sed -E 's/^eas-build-([^:]+):(.+)$/\2/')

          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Export Expo public env
        if: steps.resolve.outputs.should_build == 'true'
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PUB_KEY: ${{ secrets.SUPABASE_DB_PUB_KEY }}
        run: |
          if [[ -n "${EXPO_PUBLIC_SUPABASE_URL:-}" ]]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          elif [[ "${SUPABASE_DB_HOST:-}" =~ ^db\.([A-Za-z0-9]+)\.supabase\.co$ ]]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=https://${BASH_REMATCH[1]}.supabase.co" >> "$GITHUB_ENV"
          fi

          if [[ -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          elif [[ -n "${SUPABASE_DB_PUB_KEY:-}" ]]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_DB_PUB_KEY" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        if: steps.resolve.outputs.should_build == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.resolve.outputs.should_build == 'true'
        run: npm ci

      - name: Validate seed data
        if: steps.resolve.outputs.should_build == 'true'
        run: npm run seed:validate

      - name: Trigger EAS build
        if: steps.resolve.outputs.should_build == 'true'
        run: |
          eas build \
            --platform "${{ steps.resolve.outputs.platform }}" \
            --profile "${{ steps.resolve.outputs.profile }}" \
            --non-interactive
